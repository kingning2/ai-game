[package]
name = "tts"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "本地语音合成：sherpa-onnx kokoro 模型进程内推理（不联网调用），负责模型资产下载与 WAV 输出"

[dependencies]
# 本地推理引擎：默认 static feature，build.rs 自动下载对应平台原生库（首次构建较慢）
sherpa-onnx = "2.0.0"

# 资产下载（GitHub release 模型包）
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
rand.workspace = true
uuid.workspace = true
futures-util = "0.3"

# 豆包官方语音（逆向网页版 WebSocket 协议）
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
serde_json.workspace = true

# tar.bz2 解包
tar = "0.4"
bzip2 = "0.6"

# 平台缓存目录定位
dirs.workspace = true

tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
thiserror.workspace = true
edge-tts-rust = "0.1.7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
